name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/seaburr/abacusaas

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build into the local daemon first so it can be verified before pushing.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify size and user
        run: |
          ref="$IMAGE:${{ steps.sha.outputs.short }}"
          size=$(docker image inspect "$ref" --format '{{.Size}}')
          user=$(docker image inspect "$ref" --format '{{.Config.User}}')
          echo "size=$((size / 1024 / 1024))MB user=$user"
          [ "$size" -lt $((512 * 1024 * 1024)) ] || { echo "image too large"; exit 1; }
          uid="${user%%:*}"
          [[ "$uid" =~ ^[0-9]+$ ]] || { echo "USER must be numeric"; exit 1; }
          [ "$uid" -ne 0 ] || { echo "USER must not be root"; exit 1; }

      - name: Run and curl /healthz
        run: |
          docker run -d --name aaas -p 8080:8080 -e PORT=8080 \
            --read-only --tmpfs /tmp --cpus 0.25 --memory 512m \
            "$IMAGE:${{ steps.sha.outputs.short }}"
          for i in $(seq 1 20); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/abacus/rest/api/v1/get/42
          docker logs aaas
          docker rm -f aaas

      - name: Push
        run: |
          docker push "$IMAGE:${{ steps.sha.outputs.short }}"
          docker push "$IMAGE:latest"
